   ref:[["rqt_graph","Visual node/topic map"],["↻ refresh","Update the graph"],["ros2 node info /n","Node's pubs/subs"]],
   mastery:"Run your publisher + subscriber, open <code>rqt_graph</code>, and find your two nodes connected by the topic.",
   sol:`<pre><code>python3 talker.py
python3 listener.py
rqt_graph   <span class="out"># /talker → /chatter → /listener</span></code></pre><p>No connection? Click ↻ refresh, then verify the topic names match exactly.</p>`,
   link:{label:"rqt_graph",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html"}},

  {t:"Capstone: a complete pub/sub system",
   model:"Prove you can build a working ROS2 system from scratch: a sensor node that publishes a changing value, and a reactor node that responds when it crosses a threshold. This is the sense→decide→act loop you'll run on the G1.",
   steps:[
    {say:"Sensor node — publish a random 'distance' each second.",cmd:'import rclpy, random\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\nclass Sensor(Node):\n    def __init__(self):\n        super().__init__("sensor")\n        self.pub = self.create_publisher(Float32, "distance", 10)\n        self.create_timer(1.0, self.tick)\n    def tick(self):\n        m = Float32(); m.data = random.uniform(0,100)\n        self.pub.publish(m)',out:""},
    {say:"Reactor node — subscribe and warn when the value is too low.",cmd:'class Reactor(Node):\n    def __init__(self):\n        super().__init__("reactor")\n        self.create_subscription(Float32, "distance", self.on, 10)\n    def on(self, msg):\n        if msg.data < 20:\n            self.get_logger().warn("STOP — obstacle close!")\n        else:\n            self.get_logger().info("GO")',out:""},
    {say:"Register both in your package, build, and run them together.",cmd:"colcon build && source install/setup.bash\nros2 run my_pkg sensor\nros2 run my_pkg reactor",out:"Reactor flips GO/STOP as values cross 20."}
   ],
   trip:"Keep the two nodes in the same package and double-check both use the topic name <code>\"distance\"</code> and type <code>Float32</code>. This 'sense → decide → act' shape is the single most important pattern in the whole course — you'll reuse it on the real robot.",
   mastery:"Build and run the full sensor→reactor system in your own package. Confirm it works end-to-end.",
   sol:`<p>Both nodes above, registered in <code>setup.py</code>, then:</p><pre><code>colcon build
source install/setup.bash
ros2 run my_pkg sensor    <span class="out"># terminal 1</span>
ros2 run my_pkg reactor   <span class="out"># terminal 2</span></code></pre><p>Watch the reactor switch between GO and STOP as the random distance crosses 20.</p>`,
   link:{label:"Beginner tutorials hub",url:"https://docs.ros.org/en/jazzy/Tutorials.html"}}
 ]},

{id:"cpp",icon:"⚙️",title:"C++",time:"ongoing (after ROS2 basics)",why:"Needed for low-level motor control and performance. unitree_sdk2 is C++ based.",
 resource:{label:"learncpp.com",url:"https://www.learncpp.com/"},
 tasks:[
  {t:"Compile and run a hello-world",
   model:"Unlike Python, C++ must be <b>compiled</b> into a binary before it runs. That extra build step is the price of C++'s speed — and it's the workflow the whole SDK uses.",
   steps:[
    {say:"Install the compiler.",cmd:"sudo apt install build-essential -y",out:"Gives you g++ (the C++ compiler)."},
    {say:"Write <code>hello.cpp</code>.",cmd:'#include <iostream>\nint main() {\n    std::cout << "Hello, C++!" << std::endl;\n    return 0;\n}',out:""},
    {say:"Compile it into a program, then run that program.",cmd:"g++ hello.cpp -o hello\n./hello",out:"→ Hello, C++!"}
   ],
   trip:"Two-step trap: editing <code>hello.cpp</code> does nothing until you <b>recompile</b>. If your change isn't showing, you forgot to re-run <code>g++</code>. Python runs source directly; C++ runs the compiled binary, so: edit → compile → run, every time.",
   ref:[["g++ f.cpp -o name","Compile into 'name'"],["./name","Run the compiled program"],["#include <x>","Pull in a library"]],
   mastery:"Install build-essential, write hello.cpp, compile it, and run the binary.",
   sol:`<pre><code>sudo apt install build-essential -y
g++ hello.cpp -o hello
./hello   <span class="out"># Hello, C++!</span></code></pre>`,
   link:{label:"Your first program",url:"https://www.learncpp.com/cpp-tutorial/introduction-to-cpp-development/"}},

  {t:"Types, variables, pointers & references",
   model:"C++ makes you state types explicitly. The new idea vs Python: a <b>pointer</b> holds a memory address, and a <b>reference</b> is a nickname for an existing variable. This is how you pass big data around without copying it.",
   steps:[
    {say:"Declare with explicit types.",cmd:"int age = 21;\ndouble height = 1.75;",out:"Each variable's type is fixed."},
    {say:"A pointer stores the address of <code>age</code>; <code>*</code> reads the value there.",cmd:"int* p = &age;\nstd::cout << *p;   // 21",out:"→ 21"},
    {say:"A reference is another name for the same variable.",cmd:"int& ref = age;\nref = 30;          // age is now 30",out:"Changing ref changes age."}
   ],
   trip:"<code>&</code> and <code>*</code> flip meaning by context: in a declaration <code>int* p</code> / <code>int& r</code> they mean 'pointer'/'reference'; in an expression <code>&age</code> means 'address of' and <code>*p</code> means 'value at'. Read declarations and expressions separately and it stops being confusing.",
   ref:[["int x","A value"],["int* p = &x","Pointer to x"],["*p","Value p points to"],["int& r = x","Reference (alias) to x"]],
   mastery:"Make an int, a pointer to it, and a reference. Change the value through each and print it.",
   sol:`<pre><code>#include &lt;iostream&gt;
int main() {
    int age = 21;
    int* p = &amp;age;
    int&amp; ref = age;
    *p = 25;   std::cout &lt;&lt; age &lt;&lt; "\\n";   <span class="out">// 25</span>
    ref = 30;  std::cout &lt;&lt; age &lt;&lt; "\\n";   <span class="out">// 30</span>
}</code></pre>`,
   link:{label:"Pointers",url:"https://www.learncpp.com/cpp-tutorial/introduction-to-pointers/"}},

  {t:"Functions and headers (.h / .cpp)",
   model:"C++ splits code in two: a <b>header</b> (<code>.h</code>) declares what exists; a <b>source</b> file (<code>.cpp</code>) defines how it works. Big projects (like the SDK) stay organized this way.",
   steps:[
    {say:"Declare functions in <code>math.h</code>.",cmd:"int add(int a, int b);\nint multiply(int a, int b);",out:"Just the signatures."},
    {say:"Define them in <code>math.cpp</code>.",cmd:'#include "math.h"\nint add(int a, int b) { return a + b; }\nint multiply(int a, int b) { return a * b; }',out:""},
    {say:"Use them from <code>main.cpp</code> and compile all sources together.",cmd:'#include <iostream>\n#include "math.h"\nint main() { std::cout << add(2,3); }\n// then:\ng++ main.cpp math.cpp -o app',out:"→ 5"}
   ],
   trip:"You must list <b>every</b> .cpp file when compiling: <code>g++ main.cpp math.cpp -o app</code>. Forgetting one gives an 'undefined reference' linker error — the compiler knows the function exists (from the header) but can't find its body. That's your cue to add the missing .cpp.",
   ref:[["// .h","Declarations (what exists)"],["// .cpp","Definitions (how it works)"],["#include \"math.h\"","Use your own header"],["g++ a.cpp b.cpp -o app","Compile multiple files"]],
   mastery:"Split an <code>add</code> and <code>multiply</code> function into math.h/math.cpp, use them from main.cpp, and compile.",
   sol:`<p><code>math.h</code> → declarations, <code>math.cpp</code> → definitions, <code>main.cpp</code> → uses them:</p><pre><code>g++ main.cpp math.cpp -o app && ./app</code></pre>`,
   link:{label:"Header files",url:"https://www.learncpp.com/cpp-tutorial/header-files/"}},

  {t:"Classes, constructors, methods",
   model:"Same idea as Python classes, stricter syntax. You add <code>public</code>/<code>private</code> to control what the outside world can touch — this is encapsulation, and the SDK uses it everywhere.",
   steps:[
    {say:"Define a class with a constructor and a method.",cmd:'class Robot {\npublic:\n    Robot(std::string n) : name(n) {}\n    void walk() { std::cout << name << " walks\\n"; }\nprivate:\n    std::string name;\n};',out:""},
    {say:"Create an object and call its method.",cmd:'Robot g1("G1");\ng1.walk();',out:"→ G1 walks"}
   ],
   trip:"The <code>Robot(std::string n) : name(n) {}</code> bit is a 'member initializer list' — it sets <code>name</code> from <code>n</code>. And don't forget the <b>semicolon after the closing brace</b> of a class (<code>};</code>) — leaving it off is the single most common C++ class error.",
   ref:[["public:","Accessible from outside"],["private:","Hidden inside the class"],["Class() : x(v) {}","Constructor + init list"],["obj.method()","Call a method"]],
   mastery:"Write a <code>Counter</code> class with a private count, an <code>increment()</code> method, and a <code>get()</code> method.",
   sol:`<pre><code>#include &lt;iostream&gt;
class Counter {
public:
    void increment() { count_++; }
    int get() { return count_; }
private:
    int count_ = 0;
};
int main() {
    Counter c; c.increment(); c.increment();
    std::cout &lt;&lt; c.get() &lt;&lt; "\\n";   <span class="out">// 2</span>
}</code></pre>`,
   link:{label:"Classes intro",url:"https://www.learncpp.com/cpp-tutorial/introduction-to-classes/"}},

  {t:"Standard library: vector, string, map",
   model:"The STL gives you ready-made containers so you don't reinvent them. <code>vector</code> = resizable array, <code>string</code> = text, <code>map</code> = key→value (C++'s version of a Python dict).",
   steps:[
    {say:"A vector you can grow.",cmd:"std::vector<int> nums = {1, 2, 3};\nnums.push_back(4);",out:"nums is now {1,2,3,4}."},
    {say:"A map from text to number.",cmd:'std::map<std::string,int> legs;\nlegs["G1"] = 2;',out:"legs[\"G1\"] == 2"},
    {say:"Loop over a vector the modern way.",cmd:'for (int n : nums) std::cout << n << " ";',out:"→ 1 2 3 4"}
   ],
   trip:"Remember the includes — <code>#include &lt;vector&gt;</code>, <code>&lt;string&gt;</code>, <code>&lt;map&gt;</code> — each container needs its header. A 'vector was not declared' error just means you forgot the include at the top.",
   ref:[["vector<T>","Resizable array"],[".push_back(x)","Add to end"],["map<K,V>","Key→value store"],["for (T x : v)","Range-based loop"]],
   mastery:"Make a vector of 5 numbers, loop over it to compute the sum, and store the result in a map.",
   sol:`<pre><code>#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;map&gt;
#include &lt;string&gt;
int main() {
    std::vector&lt;int&gt; nums = {10,20,30,40,50};
    int sum = 0;
    for (int n : nums) sum += n;
    std::map&lt;std::string,int&gt; r; r["sum"] = sum;
    std::cout &lt;&lt; r["sum"] &lt;&lt; "\\n";   <span class="out">// 150</span>
}</code></pre>`,
   link:{label:"std::vector",url:"https://www.learncpp.com/cpp-tutorial/introduction-to-stdvector-and-list-constructors/"}},

  {t:"CMake basics: build a project",
   model:"Typing <code>g++ a.cpp b.cpp ...</code> by hand gets painful fast. <b>CMake</b> describes your build once, then one command compiles everything. ROS2 and unitree_sdk2 are both built this way.",
   steps:[
    {say:"Write a <code>CMakeLists.txt</code> next to your code.",cmd:"cmake_minimum_required(VERSION 3.10)\nproject(MyApp)\nadd_executable(app main.cpp math.cpp)",out:"Describes how to build 'app'."},
    {say:"Generate build files in a separate <code>build/</code> folder.",cmd:"mkdir build && cd build\ncmake ..",out:"Reads ../CMakeLists.txt."},
    {say:"Compile and run.",cmd:"make\n./app",out:"Builds and runs your program."}
   ],
   trip:"Always build in a separate <code>build/</code> directory (the 'out-of-source' build) and run <code>cmake ..</code> pointing back up at the CMakeLists. This keeps generated junk out of your source folder — exactly the pattern you'll use to build the SDK.",
   ref:[["add_executable(app ...)","Define a program"],["cmake ..","Generate build files"],["make","Compile"],["./app","Run"]],
   mastery:"Take your multi-file project from the headers lesson and build it with a CMakeLists.txt instead of calling g++ directly.",
   sol:`<pre><code><span class="out"># CMakeLists.txt</span>
cmake_minimum_required(VERSION 3.10)
project(MyApp)
add_executable(app main.cpp math.cpp)</code></pre><pre><code>mkdir build && cd build
cmake .. && make && ./app</code></pre>`,
   link:{label:"CMake tutorial",url:"https://cmake.org/cmake/help/latest/guide/tutorial/index.html"}},

  {t:"Capstone: write a ROS2 C++ node",
   model:"Bridge both worlds — rebuild your Python publisher in C++. Same shape (a Node class with a timer), different syntax. This is the exact skill the SDK demands.",
   steps:[
    {say:"Create an <code>ament_cmake</code> package and add <code>talker.cpp</code> in <code>src/</code>.",cmd:"cd ~/ros2_ws/src\nros2 pkg create --build-type ament_cmake my_cpp_pkg --dependencies rclcpp std_msgs",out:""},
    {say:"Write the node: a class publishing a String on a 1s timer.",cmd:'#include "rclcpp/rclcpp.hpp"\n#include "std_msgs/msg/string.hpp"\nclass Talker : public rclcpp::Node {\npublic:\n  Talker() : Node("talker") {\n    pub_ = create_publisher<std_msgs::msg::String>("chatter", 10);\n    timer_ = create_wall_timer(std::chrono::seconds(1), [this](){\n      std_msgs::msg::String m; m.data = "hi from C++";\n      pub_->publish(m);\n    });\n  }\nprivate:\n  rclcpp::Publisher<std_msgs::msg::String>::SharedPtr pub_;\n  rclcpp::TimerBase::SharedPtr timer_;\n};',out:""},
    {say:"Register it in CMakeLists.txt, build, and verify.",cmd:"colcon build && source install/setup.bash\nros2 run my_cpp_pkg talker\nros2 topic echo /chatter",out:"→ data: 'hi from C++'"}
   ],
   trip:"For C++ packages you wire things up in <b>CMakeLists.txt</b> (not setup.py): <code>add_executable</code>, <code>ament_target_dependencies(... rclcpp std_msgs)</code>, and an <code>install(TARGETS ...)</code> line. Forgetting the install line means <code>ros2 run</code> can't find your node.",
   mastery:"Build and run this C++ publisher in a colcon package, and verify with <code>ros2 topic echo /chatter</code>.",
   sol:`<p>Key CMakeLists.txt lines:</p><pre><code>find_package(rclcpp REQUIRED)
find_package(std_msgs REQUIRED)
add_executable(talker src/talker.cpp)
ament_target_dependencies(talker rclcpp std_msgs)
install(TARGETS talker DESTINATION lib/\${PROJECT_NAME})</code></pre><pre><code>cd ~/ros2_ws && colcon build
source install/setup.bash
ros2 run my_cpp_pkg talker
ros2 topic echo /chatter   <span class="out"># "hi from C++"</span></code></pre>`,
   link:{label:"C++ pub/sub tutorial",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Writing-A-Simple-Cpp-Publisher-And-Subscriber.html"}}
 ]},

{id:"g1sdk",icon:"🦿",title:"Unitree G1 SDK",time:"the goal",why:"Everything above leads here. Now you control the robot directly with unitree_sdk2.",
 resource:{label:"unitree_sdk2 on GitHub",url:"https://github.com/unitreerobotics/unitree_sdk2"},
 tasks:[
  {t:"Clone and build unitree_sdk2",
   model:"The SDK is the C++ library that talks to the G1's motors and sensors. You clone it with git and build it with CMake — both skills you already practiced. Nothing new, just pointed at the real thing.",
   steps:[
    {say:"Clone the repository into your home folder.",cmd:"cd ~\ngit clone https://github.com/unitreerobotics/unitree_sdk2.git",out:"Downloads the SDK source."},
    {say:"Build it the CMake way you learned.",cmd:"cd unitree_sdk2\nmkdir build && cd build\ncmake ..\nmake",out:"Compiles the library + example binaries."}
   ],
   trip:"If <code>cmake</code> or <code>make</code> stops, <b>read the error</b> — it almost always names a missing dependency. Install it with <code>sudo apt install &lt;package&gt;</code> (the README lists exact requirements) and re-run. Don't skim past the first error; later errors are usually just fallout from it.",
   ref:[["git clone URL","Download the SDK"],["cmake ..","Generate build files"],["make","Compile"],["sudo apt install x","Fix a missing dependency"]],
   mastery:"Clone the SDK and build it successfully. Resolve any missing-dependency errors using apt.",
   sol:`<pre><code>cd ~
git clone https://github.com/unitreerobotics/unitree_sdk2.git
cd unitree_sdk2 && mkdir build && cd build
cmake .. && make</code></pre><p>Success = build finishes and example binaries appear in <code>build/</code>.</p>`,
   link:{label:"unitree_sdk2 README",url:"https://github.com/unitreerobotics/unitree_sdk2"}},

  {t:"Connect to the G1 and read robot state",
   model:"The robot talks over Ethernet using DDS — the same messaging tech under ROS2. The golden first move with any robot: <b>read before you write</b>. Confirm you can see its state before you ever send a command.",
   steps:[
    {say:"Connect the Ethernet cable and set your PC's IP to the robot's subnet (the README gives the exact address).",cmd:"",out:"Network link established."},
    {say:"From <code>build/</code>, run a read-only state example (prints state, doesn't move anything).",cmd:"./read_state_example   # name varies by SDK version",out:"Prints joint positions, IMU, battery."},
    {say:"Gently move the robot by hand and watch the numbers change.",cmd:"",out:"<b>Changing values = link confirmed.</b>"}
   ],
   trip:"Wrong subnet = silence. If you see no data, the #1 cause is your PC's IP not being on the robot's network. Double-check it against the README before suspecting anything else. And keep the robot on a stand for every early test.",
   ref:[["Set PC IP","Match robot's subnet"],["Read-only example","Prints state, no motion"],["IMU / joints / battery","What you're reading"]],
   mastery:"Connect to the G1, run a state-reading example, and watch real sensor values stream in.",
   sol:`<p>Guidance: set your PC's IP to the robot's subnet (README), run a read-only state example from <code>build/</code>, and confirm values change as you move the robot by hand. Robot supported at all times.</p>`,
   link:{label:"SDK examples folder",url:"https://github.com/unitreerobotics/unitree_sdk2/tree/main/example"}},

  {t:"Run a provided high-level example",
   model:"The SDK ships with example programs. <b>High-level</b> control sends whole-body commands ('stand', 'walk forward') and the robot keeps its own balance. Always start here before low-level motor control.",
   steps:[
    {say:"Pick a high-level locomotion example from the <code>example/</code> folder and open the code.",cmd:"",out:"Read it before running it."},
    {say:"Find three things in the code: where it connects, what command it sends, and any safety limits.",cmd:"",out:"Understand it, don't just launch it."},
    {say:"Run it with the robot safely supported and your hand on the e-stop.",cmd:"./high_level_example   # name varies",out:"Robot performs the demo motion."}
   ],
   trip:"Never run an example you haven't read. Reading first tells you what the robot is about to do, so nothing surprises you. The command is usually a method on a high-level client object (a <code>Move</code>/<code>SetVelocity</code>-style call) — note its exact name in <i>your</i> version.",
   ref:[["High-level","Whole-body commands, auto-balance"],["Low-level","Direct motor control (later)"],["e-stop","Always within reach"]],
   mastery:"Run one official high-level example and watch the robot respond. Note exactly which function sends the command.",
   sol:`<p>Guidance: choose a high-level example, read it to find the connect call and the command-sending method, then run with the robot supported and e-stop ready. Write down the exact command function name for your SDK version.</p>`,
   link:{label:"Unitree developer docs",url:"https://support.unitree.com/home/en/developer"}},

  {t:"Send a basic command safely",
   model:"Now you modify an example to send your <i>own</i> command — small and safe. The flow mirrors ROS2: build a command message, set its fields, publish it on a loop. This is where your skills become real motion.",
   steps:[
    {say:"Start from a working example so the connection boilerplate is already correct.",cmd:"",out:"Don't start from scratch."},
    {say:"Change exactly one thing: a small target well within the documented limits (e.g. a gentle posture shift).",cmd:"",out:"Tiny first, always."},
    {say:"Send it inside a controlled loop, staying next to the e-stop.",cmd:"",out:"Robot performs your command."}
   ],
   trip:"Resist the urge to send a big or fast motion 'to really see it work'. First commands should be small and slow — a tiny safe target proves your code path works without risking the hardware or yourself. Scale up only once it behaves.",
   ref:[["Copy a working example","Correct boilerplate"],["Change one value","Stay within limits"],["Controlled loop","Send at a steady rate"]],
   mastery:"Modify an example to send one small, safe command of your own and observe the robot execute it.",
   sol:`<p>Guidance: copy a working example, change one target to a small in-limit value, send it in a controlled loop with the robot supported and e-stop in hand. This is your Python/ROS2/C++ skills turning into deliberate motion.</p>`,
   link:{label:"SDK examples",url:"https://github.com/unitreerobotics/unitree_sdk2/tree/main/example"}},

  {t:"Understand the control loop and safety limits",
   model:"Real control runs a tight loop: read state → compute command → send → repeat, often hundreds of times per second. Understanding this loop is what separates copying examples from actually engineering behaviour.",
   steps:[
    {say:"In an example, find the main <code>while</code> loop that repeats read→compute→send.",cmd:"",out:"That's the control loop."},
    {say:"Find how it holds a steady rate (a sleep or timer) and note the frequency.",cmd:"",out:"Late commands = unstable robot."},
    {say:"Locate where joint angle, velocity, and torque limits are enforced (constants or clamp calls).",cmd:"",out:"Write a note on each limit."}
   ],
   trip:"Two things keep a robot safe: a <b>steady loop rate</b> (irregular timing makes it wobble) and <b>respecting limits</b> (never exceed joint/velocity/torque caps). Always have an emergency stop and a 'go limp / damping' command ready before you run anything.",
   ref:[["Loop rate","Fast + steady (e.g. hundreds of Hz)"],["Joint/vel/torque limits","Hard caps — never exceed"],["Damping / e-stop","Your failsafes"]],
   mastery:"In an example, find the control loop and its rate, and locate where joint/torque limits are enforced. Write notes on each.",
   sol:`<p>Model answer: the loop is a <code>while</code> repeating read→compute→send, held to a fixed rate by a sleep/timer; limits appear as constants or <code>clamp</code>/min-max calls before a command is sent. Note the rate and each limit.</p>`,
   link:{label:"Developer support",url:"https://support.unitree.com/home/en/developer"}},

  {t:"Capstone: your own first control program",
   model:"Your graduation project: a small, original, safe program on the G1 that reads state, decides, and acts — the sense→decide→act loop, now on real hardware. Everything in this course was preparation for this.",
   steps:[
    {say:"Structure it as a loop: SENSE (read state) → DECIDE (your logic) → clamp to limits → ACT (send command).",cmd:"connect()\nwhile running:\n    state = read_state()      # SENSE\n    cmd = my_logic(state)     # DECIDE\n    cmd = clamp(cmd, limits)  # stay safe\n    send(cmd)                 # ACT",out:""},
    {say:"Keep the behaviour small and safe (e.g. respond to a tilt or a joint reading), with an e-stop always available.",cmd:"",out:"Robot runs your behaviour."},
    {say:"Version it with git and push to GitHub.",cmd:'git init && git add . && git commit -m "My first G1 behavior"',out:"Your work is saved + shareable."}
   ],
   trip:"The exact API calls depend on your SDK version and firmware — confirm every call against the README and the example code, don't assume. And keep the first behaviour modest: a clean, safe, working small program beats an ambitious one that's unsafe or doesn't run.",
   mastery:"Design, build, and safely run an original sense→decide→act program on the G1. Commit it to a git repo.",
   sol:`<pre><code>connect to robot
loop (steady rate):
    state  = read robot state     <span class="out"># SENSE</span>
    action = your_logic(state)     <span class="out"># DECIDE</span>
    action = clamp(action, limits) <span class="out"># stay safe</span>
    send(action)                   <span class="out"># ACT</span>
    (emergency stop always ready)</code></pre><p>Then <code>git init / add / commit</code> and push. If a stranger could clone it, read your README, and run it safely — you've hit intermediate.</p>`,
   link:{label:"unitree_sdk2 repo",url:"https://github.com/unitreerobotics/unitree_sdk2"}}
 ]}
];

const PROJECTS={
  wsl:{name:"Backup & Project Toolkit",brief:"Build a small command-line workflow that proves you can live in the terminal and version your work with git.",reqs:["Create a clean <code>~/projects</code> structure with at least two nested folders (use <code>mkdir -p</code>).","Write a script <code>backup.sh</code> that copies a folder into <code>/mnt/c/</code> and prints a confirmation.","Make it executable with <code>chmod +x backup.sh</code> and run it with <code>./backup.sh</code>.","Turn the folder into a git repo: <code>git init</code>, commit the script, write a clear message."],stretch:["Add a timestamp to the backup folder name using <code>$(date +%F)</code>.","Push the repo to a new GitHub repository."],pass:"You can build the structure, run your script, and show <code>git log</code> with at least one commit — without copying commands from notes."},
  python:{name:"Robot Mission Logger (CLI app)",brief:"A text-based program that tracks 'missions' for your future robot. Touches every Python lesson at once.",reqs:["A <code>Mission</code> class with a name and a done/not-done status.","A menu loop (<code>while</code> + <code>input()</code>) to add, list, and complete missions.","Save missions to a file and reload them when the program restarts.","Wrap risky input in <code>try/except</code> so bad input never crashes it."],stretch:["Add priorities and sort the list by priority.","Track a timestamp for when each mission was completed."],pass:"You can add missions, quit, restart, and your missions are still there — with no crash on bad input."},
  ros2:{name:"Obstacle-Avoider (3-node system)",brief:"A miniature sense→decide→act robot brain — the exact pattern you'll use on the G1, with fake data.",reqs:["A <b>sensor</b> node publishing a fake distance reading on a topic.","A <b>brain</b> node that subscribes and publishes a command: 'GO' if far, 'STOP' if close.","A <b>motor</b> node that subscribes to the command and logs what it would do.","All three in one colcon package, launched with <code>ros2 run</code>."],stretch:["Add a parameter for the stop-distance threshold so you can tune it without editing code.","Open <code>rqt_graph</code> and screenshot the three connected nodes."],pass:"All three nodes run together and the motor reacts in real time as sensor values cross the threshold."},
  cpp:{name:"Fast Stats Engine",brief:"Rebuild real logic in compiled C++ — organized, fast, and built the way the SDK is built.",reqs:["A <code>Stats</code> class split into <code>stats.h</code>/<code>stats.cpp</code> taking a <code>std::vector&lt;double&gt;</code>.","Methods for mean, min, max, and count.","A <code>main.cpp</code> that fills a vector and prints all the stats.","Built with a <code>CMakeLists.txt</code> (not a hand-typed g++ command)."],stretch:["Add standard deviation.","Wrap it as a ROS2 C++ node that publishes the computed mean."],pass:"<code>cmake .. && make && ./app</code> compiles cleanly and prints correct stats from your Stats class."},
  g1sdk:{name:"Reactive Posture Guardian",brief:"Your first real safety-aware robot behaviour — read state, decide, act, all within limits.",reqs:["Read the robot's orientation/IMU state in a loop.","Decide: if tilt exceeds a safe threshold you define, trigger a safe damping/standing response.","Send that command through a clean control loop at a steady rate.","Keep a working emergency stop; test only with the robot supported."],stretch:["Log every state+decision to a file to review the run.","Make the threshold tunable and test a few values safely."],pass:"With the robot supported, your program reads live state and triggers the correct safe response when you tilt it past the threshold."}
};
const GRAND={name:"Grand Challenge: Autonomous Behavior, End to End",brief:"Prove the whole stack came together. One project that uses every skill from WSL to the SDK.",reqs:["<b>WSL/git:</b> the whole project lives in a git repo you push to GitHub.","<b>Python or C++:</b> your own clean, well-structured code (classes, functions, error handling).","<b>ROS2:</b> at least two nodes communicating — a sense→decide→act loop.","<b>SDK:</b> reads real G1 state and sends a safe, original behaviour in response.","A README explaining what it does, how to run it, and the safety limits."],pass:"Someone could clone your repo, read the README, and run your behaviour on a G1 safely. At that point you are, by any reasonable definition, an intermediate robot programmer."};

/* ============================ APP ============================ */
const KEY="g1-learning-station-v4";
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function saveState(s){localStorage.setItem(KEY,JSON.stringify(s));}
let state=loadState();
const app=document.getElementById("app");

function tKey(sid,i){return sid+":"+i;}
function stageById(sid){return ROADMAP.find(s=>s.id===sid);}
function flatLessons(){const a=[];ROADMAP.forEach(s=>s.tasks.forEach((t,i)=>a.push({sid:s.id,i})));return a;}

function totals(){
  let total=0,done=0;
  ROADMAP.forEach(s=>{s.tasks.forEach((_,i)=>{total++;if(state[tKey(s.id,i)])done++;});total++;if(state["proj:"+s.id])done++;});
  total++;if(state["grand"])done++;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function findNext(){
  for(const s of ROADMAP){
    for(let i=0;i<s.tasks.length;i++){if(!state[tKey(s.id,i)])return{type:"lesson",sid:s.id,i,label:s.tasks[i].t,where:s.title};}
    if(!state["proj:"+s.id])return{type:"project",sid:s.id,label:"🎯 Project: "+PROJECTS[s.id].name,where:s.title};
  }
  if(!state["grand"])return{type:"grand",label:"🏆 "+GRAND.name,where:"Final challenge"};
  return null;
}

/* -------- HOME -------- */
function renderHome(){
  window.scrollTo(0,0);
  const t=totals(), next=findNext();
  let html=`<header><h1>🤖 Unitree G1 Learning Station</h1>
    <p>From zero experience to intermediate. Click a lesson to open its full walkthrough. Everything saves automatically.</p></header>`;

  if(t.pct===100) html+=`<div class="celebrate show">🎉 <strong>All complete!</strong> You went from terminal newbie to G1 programmer. Go build something real.</div>`;

  if(next){
    html+=`<div class="nextup" onclick="goNext()"><div>
      <div class="tag">▶ Next up</div><div class="what">${next.label}</div>
      <div class="where">${next.where}</div></div><div class="go">→</div></div>`;
  }

  html+=`<div class="overall">
    <div class="row"><div>Overall progress</div><div class="pct">${t.pct}%</div></div>
    <div class="bar"><span style="width:${t.pct}%"></span></div>
    <div class="row" style="margin-top:14px;margin-bottom:0;">
      <div style="color:var(--muted);font-size:.82rem;">${t.done} of ${t.total} items done</div>
      <button class="reset" onclick="resetAll()">Reset all progress</button></div></div>`;

  let firstIncomplete=false;
  ROADMAP.forEach((s,sIdx)=>{
    let done=0; s.tasks.forEach((_,i)=>{if(state[tKey(s.id,i)])done++;});
    if(state["proj:"+s.id])done++;
    const total=s.tasks.length+1, complete=done===total, pct=Math.round(done/total*100);
    const active=!complete&&!firstIncomplete; if(active)firstIncomplete=true;
    const openKey="open:"+s.id;
    const isOpen=state[openKey]!==undefined?state[openKey]:active;
    const o=OVERVIEWS[s.id];
    const chain=STAGE_ORDER.map(([id,nm],i)=>`<span class="node${id===s.id?' here':''}">${nm}</span>${i<STAGE_ORDER.length-1?'<span class="arrow">→</span>':''}`).join("");

    html+=`<div class="stage${complete?' done':''}${active?' active':''}${isOpen?' open':''}">
      <div class="stage-head" onclick="toggleStage('${s.id}')">
        <div class="badge">${complete?'✓':s.icon}</div>
        <div class="stage-title"><h2>Stage ${sIdx+1}: ${s.title}</h2><div class="meta">⏱ ${s.time}</div></div>
        <div class="stage-pct">${done}/${total} · ${pct}%</div><div class="chev">▶</div></div>
      <div class="stage-body">
        <div class="why">💡 ${s.why}</div>
        <div class="overview"><div class="otitle">📖 Chapter Overview</div>
          <div class="oblock"><span class="olabel">Why we learn this</span><span class="otext">${o.why}</span></div>
          <div class="oblock"><span class="olabel">How it connects</span><span class="otext">${o.connect}</span></div>
          <div class="oblock"><span class="olabel">Where it gets you</span><span class="otext">${o.ready}</span></div>
          <div class="chain">${chain}</div></div>
        <a class="resource-link" href="${s.resource.url}" target="_blank" rel="noopener">📚 ${s.resource.label} ↗</a>`;

    s.tasks.forEach((task,i)=>{
      const d=!!state[tKey(s.id,i)];
      html+=`<div class="lrow${d?' done':''}" onclick="openLesson('${s.id}',${i})">
        <div class="lcheck">${d?'✓':i+1}</div>
        <div class="lname">${task.t}</div><div class="lgo">Open →</div></div>`;
    });

    const p=PROJECTS[s.id], pd=!!state["proj:"+s.id], popen=!!state["popen:"+s.id];
    html+=`<div class="project${pd?' done':''}${popen?' popen':''}">
      <div class="project-head" onclick="toggleProj(event,'${s.id}')">
        <input type="checkbox" ${pd?'checked':''} onclick="event.stopPropagation();toggleProjDone('${s.id}',this.checked)">
        <div class="pt"><div class="ptag">🎯 Project Challenge — test your comprehension</div><div class="pname">${p.name}</div></div>
        <div class="pchev">▶</div></div>
      <div class="project-content"><p>${p.brief}</p>
        <h4>Requirements</h4><ul>${p.reqs.map(r=>'<li>'+r+'</li>').join('')}</ul>
        <h4>Stretch goals</h4><ul>${p.stretch.map(r=>'<li>'+r+'</li>').join('')}</ul>
        <div class="pass"><b>✅ You've passed when:</b> ${p.pass}</div></div></div>`;

    html+=`</div></div>`;
  });

  const gd=!!state["grand"], gopen=!!state["gopen"];
  html+=`<div class="grand${gopen?' gopen':''}">
    <div class="grand-head" onclick="toggleGrand(event)">
      <input type="checkbox" ${gd?'checked':''} onclick="event.stopPropagation();toggleGrandDone(this.checked)">
      <div class="gt"><div class="gtag">🏆 Final integration project</div><h2>${GRAND.name}</h2></div>
      <div class="gchev" style="margin-left:auto;">▶</div></div>
    <div class="grand-content"><p>${GRAND.brief}</p>
      <h4>Requirements</h4><ul>${GRAND.reqs.map(r=>'<li>'+r+'</li>').join('')}</ul>
      <div class="pass"><b>✅ You've passed when:</b> ${GRAND.pass}</div></div></div>`;

  html+=`<footer>Progress is stored locally in this browser. Use the same browser each session.</footer>`;
  app.innerHTML=html;
}

/* -------- LESSON PAGE -------- */
function renderLesson(sid,i){
  window.scrollTo(0,0);
  const s=stageById(sid); if(!s||!s.tasks[i]){location.hash="";return;}
  const task=s.tasks[i];
  const flat=flatLessons();
  const idx=flat.findIndex(x=>x.sid===sid&&x.i===i);
  const prev=idx>0?flat[idx-1]:null, nextL=idx<flat.length-1?flat[idx+1]:null;
  const done=!!state[tKey(sid,i)];

  let html=`<div class="lesson-page">
    <div class="breadcrumb"><a href="#" onclick="return go('')">🏠 Home</a> &nbsp;›&nbsp; ${s.icon} ${s.title} &nbsp;›&nbsp; Lesson ${i+1} of ${s.tasks.length}</div>
    <h1>${task.t}</h1><div class="sub">Stage: ${s.title}</div>`;

  // Mental model
  if(task.model) html+=`<div class="sec model"><h3>🧠 The mental model</h3><p>${task.model}</p></div>`;

  // Walkthrough
  if(task.steps&&task.steps.length){
    html+=`<div class="sec"><h3>⌨️ Do this with me</h3>`;
    task.steps.forEach((st,n)=>{
      html+=`<div class="step"><div class="snum">${n+1}</div><div class="sbody">
        <div class="say">${st.say}</div>
        ${st.cmd?`<pre><code>${escapeHtml(st.cmd)}</code></pre>`:''}
        ${st.out?`<div class="expect">${st.out}</div>`:''}
      </div></div>`;
    });
    html+=`</div>`;
  }

  // Trip-ups
  if(task.trip) html+=`<div class="sec trip"><h3>⚠️ Where beginners trip</h3><p>${task.trip}</p></div>`;

  // Reference
  if(task.ref&&task.ref.length){
    html+=`<div class="sec"><h3>📋 Quick reference</h3><table class="ref">${task.ref.map(r=>`<tr><td><code>${escapeHtml(r[0])}</code></td><td>${r[1]}</td></tr>`).join('')}</table></div>`;
  }

  // Mastery + solution
  html+=`<div class="sec mastery"><h3>🎯 Mastery test</h3><p>${task.mastery}</p>
    <button class="soltoggle" onclick="toggleSol(this)">🔑 Show solution</button>
    <div class="solbody">${task.sol||'<p>(try it yourself first!)</p>'}</div>
    <p style="margin-top:12px;"><a href="${task.link.url}" target="_blank" rel="noopener">🔗 ${task.link.label} ↗</a></p></div>`;

  // Footer: mark complete + nav
  html+=`<div class="lpfoot">
    <button class="markbtn ${done?'isdone':''}" onclick="toggleLessonDone('${sid}',${i})">${done?'✓ Completed — click to undo':'Mark this lesson complete'}</button>
  </div>
  <div class="lpfoot" style="margin-top:12px;">
    <a class="navbtn ${prev?'':'disabled'}" href="#" onclick="return prev?openLesson('${prev?prev.sid:''}',${prev?prev.i:0}):false;">← Previous</a>
    <a class="navbtn" href="#" onclick="return go('')">All lessons</a>
    <a class="navbtn ${nextL?'':'disabled'}" href="#" onclick="return nextL?openLesson('${nextL?nextL.sid:''}',${nextL?nextL.i:0}):false;" style="margin-left:auto;">Next →</a>
  </div></div>`;

  app.innerHTML=html;
}

function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* -------- actions -------- */
function go(hash){location.hash=hash;return false;}
function openLesson(sid,i){location.hash="#/lesson/"+sid+"/"+i;return false;}
function goNext(){const n=findNext();if(!n)return;if(n.type==="lesson"){openLesson(n.sid,n.i);}else{state["open:"+(n.sid||'')]=true;if(n.type==="project")state["popen:"+n.sid]=true;if(n.type==="grand")state["gopen"]=true;saveState(state);location.hash="";setTimeout(()=>{const el=document.querySelector(n.type==="grand"?".grand":".project");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},60);}}
function toggleStage(sid){const k="open:"+sid;const cur=state[k]!==undefined?state[k]:false;state[k]=!cur;saveState(state);renderHome();}
function toggleProj(e,sid){const k="popen:"+sid;state[k]=!state[k];saveState(state);renderHome();}
function toggleProjDone(sid,v){state["proj:"+sid]=v;saveState(state);renderHome();}
function toggleGrand(e){state["gopen"]=!state["gopen"];saveState(state);renderHome();}
function toggleGrandDone(v){state["grand"]=v;saveState(state);renderHome();}
function toggleLessonDone(sid,i){state[tKey(sid,i)]=!state[tKey(sid,i)];saveState(state);renderLesson(sid,i);}
function toggleSol(btn){const b=btn.nextElementSibling;const sh=b.classList.toggle("show");btn.textContent=sh?"🙈 Hide solution":"🔑 Show solution";}
function resetAll(){if(confirm("Reset ALL progress? This cannot be undone.")){state={};saveState(state);renderHome();}}

/* -------- router -------- */
function route(){
  const h=location.hash;
  const m=h.match(/^#\/lesson\/([^/]+)\/(\d+)$/);
  if(m){renderLesson(m[1],parseInt(m[2],10));}
  else{renderHome();}
}
window.addEventListener("hashchange",route);
route();
</script>
