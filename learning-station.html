<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unitree G1 Learning Station</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
    --amber:#d29922; --purple:#bc8cff; --red:#f85149; --teal:#39d3b6; --code:#0b0f14;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 16px 80px;}
  .wrap{max-width:860px; margin:0 auto;}
  a{color:var(--accent);}

  header{text-align:center; margin-bottom:8px;}
  header h1{font-size:1.8rem;}
  header p{color:var(--muted); margin-top:6px; font-size:.92rem;}

  /* Next-up banner */
  .nextup{background:linear-gradient(90deg,rgba(88,166,255,.16),rgba(188,140,255,.12)); border:1px solid var(--accent); border-radius:12px; padding:14px 18px; margin:20px 0; display:flex; align-items:center; gap:14px; cursor:pointer;}
  .nextup:hover{filter:brightness(1.15);}
  .nextup .tag{font-size:.7rem; letter-spacing:1px; color:var(--accent); text-transform:uppercase;}
  .nextup .what{font-weight:600; margin-top:2px;}
  .nextup .where{color:var(--muted); font-size:.82rem;}
  .nextup .go{margin-left:auto; color:var(--accent); font-size:1.4rem;}

  /* Overall progress */
  .overall{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin:18px 0;}
  .overall .row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .overall .pct{font-size:1.4rem; font-weight:700; color:var(--green);}
  .bar{height:14px; background:var(--panel2); border-radius:8px; overflow:hidden; border:1px solid var(--border);}
  .bar > span{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--accent)); transition:width .4s ease;}
  .reset{background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.8rem;}
  .reset:hover{border-color:var(--red); color:var(--red);}

  /* Stage cards (home) */
  .stage{background:var(--panel); border:1px solid var(--border); border-radius:12px; margin-bottom:18px; overflow:hidden; border-left:4px solid var(--border); transition:border-color .3s;}
  .stage.done{border-left-color:var(--green);}
  .stage.active{border-left-color:var(--accent);}
  .stage-head{display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; user-select:none;}
  .stage-head:hover{background:var(--panel2);}
  .badge{flex:none; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.05rem; background:var(--panel2); border:2px solid var(--border);}
  .stage.done .badge{background:var(--green); border-color:var(--green); color:#0d1117;}
  .stage-title{flex:1;}
  .stage-title h2{font-size:1.15rem;}
  .stage-title .meta{color:var(--muted); font-size:.82rem; margin-top:2px;}
  .stage-pct{font-size:.85rem; color:var(--muted);}
  .chev{color:var(--muted); transition:transform .25s; font-size:.9rem;}
  .stage.open .chev{transform:rotate(90deg);}
  .stage-body{display:none; padding:0 20px 18px;}
  .stage.open .stage-body{display:block;}

  .why{background:var(--panel2); border-radius:8px; padding:10px 14px; font-size:.88rem; color:var(--muted); margin:6px 0 8px; border-left:3px solid var(--accent);}
  .resource-link{display:inline-block; font-size:.82rem; margin:2px 0 12px; text-decoration:none;}
  .resource-link:hover{text-decoration:underline;}

  /* overview */
  .overview{border:1px solid #2d5a5a; border-radius:10px; margin:2px 0 14px; background:linear-gradient(180deg,rgba(57,211,182,.08),rgba(57,211,182,.02)); padding:14px 16px;}
  .overview .otitle{font-size:.72rem; letter-spacing:1px; text-transform:uppercase; color:var(--teal); margin-bottom:8px;}
  .overview .oblock{margin:9px 0;}
  .overview .olabel{font-weight:600; color:#5fe3c8; font-size:.86rem; display:block;}
  .overview .otext{font-size:.9rem;}
  .overview .chain{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; padding-top:11px; border-top:1px solid rgba(57,211,182,.2); font-size:.78rem;}
  .overview .node{background:rgba(57,211,182,.12); border:1px solid #2d5a5a; border-radius:20px; padding:2px 10px; color:var(--muted);}
  .overview .node.here{background:var(--teal); color:#0d1117; font-weight:600;}
  .overview .arrow{color:var(--muted);}

  /* lesson list rows (home) */
  .lrow{display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; cursor:pointer;}
  .lrow:hover{background:var(--panel2); border-color:var(--accent);}
  .lrow.done{border-color:rgba(63,185,80,.4);}
  .lrow .lcheck{flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:.8rem; color:var(--muted);}
  .lrow.done .lcheck{background:var(--green); border-color:var(--green); color:#0d1117;}
  .lrow .lname{flex:1; font-weight:500;}
  .lrow .lgo{color:var(--muted);}

  /* project + grand (home) */
  .project{border:1px solid var(--purple); border-radius:10px; margin:16px 0 4px; background:linear-gradient(180deg,rgba(188,140,255,.10),rgba(188,140,255,.03)); overflow:hidden;}
  .project.done{border-color:var(--green);}
  .project-head{display:flex; align-items:flex-start; gap:11px; padding:13px 15px; cursor:pointer;}
  .project-head:hover{background:rgba(188,140,255,.08);}
  .project-head input,.grand-head input{appearance:none;-webkit-appearance:none;flex:none;width:21px;height:21px;border:2px solid var(--purple);border-radius:5px;margin-top:1px;cursor:pointer;position:relative;background:var(--bg);}
  .grand-head input{border-color:var(--amber);width:22px;height:22px;}
  .project-head input:checked,.grand-head input:checked{background:var(--green);border-color:var(--green);}
  .project-head input:checked::after,.grand-head input:checked::after{content:"✓";color:#0d1117;font-weight:700;font-size:.85rem;position:absolute;top:-1px;left:4px;}
  .project-head .pt{flex:1;}
  .project-head .ptag{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--purple);}
  .project-head .pname{font-weight:600;margin-top:2px;}
  .project.done .pname{color:var(--muted);}
  .pchev,.gchev{color:var(--muted);font-size:.8rem;transition:transform .2s;}
  .project.popen .pchev,.grand.gopen .gchev{transform:rotate(90deg);}
  .project-content,.grand-content{display:none;padding:2px 16px 16px 47px;font-size:.9rem;}
  .project.popen .project-content,.grand.gopen .grand-content{display:block;}
  .project-content h4,.grand-content h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);margin:13px 0 5px;}
  .grand-content h4{color:var(--amber);}
  .project-content ul,.grand-content ul{margin:5px 0 5px 18px;}
  .pass{background:rgba(63,185,80,.1);border-left:3px solid var(--green);border-radius:6px;padding:9px 13px;margin:11px 0;font-size:.88rem;}
  .pass b{color:var(--green);}
  .grand{border:2px solid var(--amber);border-radius:12px;margin:24px 0 10px;overflow:hidden;background:linear-gradient(180deg,rgba(210,153,34,.12),rgba(210,153,34,.03));}
  .grand-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;cursor:pointer;}
  .grand-head:hover{background:rgba(210,153,34,.08);}
  .grand-head .gt h2{font-size:1.2rem;}
  .grand-head .gtag{font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--amber);}

  /* ===== LESSON PAGE ===== */
  .breadcrumb{font-size:.82rem;color:var(--muted);margin-bottom:14px;}
  .breadcrumb a{text-decoration:none;}
  .lesson-page h1{font-size:1.5rem;margin-bottom:4px;}
  .lesson-page .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px;}
  .sec{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  .sec h3{font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .sec p{margin:8px 0;}
  .sec ul{margin:8px 0 8px 20px;}
  .sec li{margin:4px 0;}
  .model{border-left:4px solid var(--teal);}
  .model h3{color:var(--teal);}
  pre{background:var(--code);border:1px solid var(--border);border-radius:7px;padding:12px 14px;overflow-x:auto;margin:8px 0;font-size:.86rem;line-height:1.5;}
  code{font-family:"SF Mono",Consolas,Monaco,monospace;}
  p code,li code,td code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:.86em;color:var(--purple);}
  .out{color:var(--muted);}

  .step{display:flex;gap:13px;margin:14px 0;}
  .snum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#0d1117;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
  .sbody{flex:1;min-width:0;}
  .say{font-size:.9rem;margin-bottom:2px;}
  .expect{font-size:.84rem;color:var(--muted);margin-top:-2px;}
  .expect b{color:var(--green);}

  .trip{background:rgba(248,81,73,.08);border-left:3px solid var(--red);border-radius:8px;padding:12px 15px;margin:8px 0;font-size:.9rem;}
  .trip h3{color:var(--red);}
  table.ref{width:100%;border-collapse:collapse;font-size:.87rem;margin:8px 0;}
  table.ref td{border:1px solid var(--border);padding:7px 10px;vertical-align:top;}
  table.ref td:first-child{white-space:nowrap;width:1%;}

  .mastery{border-left:4px solid var(--amber);}
  .mastery h3{color:var(--amber);}
  .soltoggle{background:transparent;border:1px solid var(--border);color:var(--green);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.84rem;margin-top:6px;}
  .soltoggle:hover{border-color:var(--green);}
  .solbody{display:none;margin-top:12px;padding-left:12px;border-left:2px solid rgba(63,185,80,.35);}
  .solbody.show{display:block;}

  .lpfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .markbtn{flex:1;min-width:180px;background:var(--green);color:#0d1117;border:none;font-weight:700;padding:12px;border-radius:9px;cursor:pointer;font-size:.95rem;}
  .markbtn.isdone{background:var(--panel2);color:var(--green);border:1px solid var(--green);}
  .navbtn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:9px;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block;}
  .navbtn:hover{border-color:var(--accent);}
  .navbtn.disabled{opacity:.35;pointer-events:none;}

  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px;}
  .celebrate{text-align:center;padding:14px;border-radius:10px;margin-bottom:18px;background:linear-gradient(90deg,rgba(63,185,80,.15),rgba(88,166,255,.15));border:1px solid var(--green);display:none;}
  .celebrate.show{display:block;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================ CONTENT ============================ */
const STAGE_ORDER=[["wsl","WSL"],["python","Python"],["ros2","ROS2"],["cpp","C++"],["g1sdk","G1 SDK"]];

const OVERVIEWS={
  wsl:{why:"Every tool you'll touch — Python, ROS2, the C++ compiler, the Unitree SDK — runs in a Linux terminal. Before you can build anything, you need to move around your workshop without thinking about it.",connect:"There's no robotics here yet, and that's the point. The <code>git clone</code> and folder navigation you practice now are the <i>exact</i> moves you'll use to download the G1 SDK in the final chapter.",ready:"You can open a terminal, manage files, move data between Windows and Linux, and version code with git — the literacy every robotics tutorial assumes you already have."},
  python:{why:"Robotics is 'make the machine do what you mean.' Python is the fastest way to express that, and it's the language Unitree's examples reach for first.",connect:"You learn to think in code here. A ROS2 node is a class; a robot in the SDK is an object. The 'sense → decide → act' logic you'll run on the G1 is just an if-statement inside a loop — built right here.",ready:"You can write a real program from scratch: read data, make decisions, organize code into classes, and save results."},
  ros2:{why:"A real robot isn't one giant program — it's many small programs talking to each other. ROS2 is the standard that lets them communicate.",connect:"The publisher/subscriber pattern you build is <i>literally</i> how the G1 SDK sends commands and reads state (same DDS messaging). Learn it alongside Python.",ready:"You can design a multi-node sense→decide→act system, build it into a package, and watch it run."},
  cpp:{why:"Low-level motor control needs the speed of compiled C++. And <code>unitree_sdk2</code>, the library that controls the G1, is written in C++.",connect:"Everything from Python carries over — variables, loops, classes — with stricter syntax and a compile step. The bridge from 'I can prototype' to 'I can ship control code.'",ready:"You can compile a multi-file project with CMake (the SDK's build system) and write a C++ ROS2 node."},
  g1sdk:{why:"The destination. You connect to a real humanoid, read its sensors, and command its motors with <code>unitree_sdk2</code>.",connect:"It all converges: <code>git clone</code> (WSL), build with CMake (C++), read state + send commands with pub/sub (ROS2), structure logic as sense→decide→act (Python).",ready:"You can connect to the G1, read live state, send safe commands in a control loop, and write your own behavior — i.e. start real projects."}
};

/* Each lesson: t(title), model, steps[{say,cmd,out}], trip, ref[[a,b]], mastery, sol, link */
const ROADMAP=[
{id:"wsl",icon:"🐧",title:"WSL Basics",time:"1–2 days",why:"You need this to survive inside the terminal daily. Everything else runs here.",
 resource:{label:"Microsoft WSL basic commands",url:"https://learn.microsoft.com/en-us/windows/wsl/basic-commands"},
 tasks:[
  {t:"Install WSL and create your Linux user",
   model:"WSL drops a real Linux computer inside your Windows machine — no second PC, no dual-boot. One command sets it all up.",
   steps:[
    {say:"Open <b>PowerShell as Administrator</b> (Win → type PowerShell → right-click → Run as administrator), then install everything with one command.",cmd:"wsl --install",out:"Downloads the Linux kernel + Ubuntu, then asks you to restart."},
    {say:"Restart your PC. Ubuntu opens on its own and asks for a username and password (the password stays invisible as you type — that's normal).",cmd:"",out:""},
    {say:"Check it landed on the fast version.",cmd:"wsl --status",out:"Should say <b>Default Version: 2</b>."}
   ],
   trip:"The invisible password scares people. It's not frozen — Linux hides password characters on purpose. Just type it and press Enter. Your Linux username does <b>not</b> need to match Windows.",
   mastery:"Open your new Ubuntu terminal and run <code>whoami</code> — it should print your Linux username.",
   sol:`<pre><code>whoami
<span class="out"># → ivan  (the name you chose at install)</span></code></pre><p>Confirms which Linux user you're logged in as — separate from Windows.</p>`,
   link:{label:"WSL install guide",url:"https://learn.microsoft.com/en-us/windows/wsl/install"}},

  {t:"Navigate folders: pwd, ls, cd, mkdir",
   model:"Think of Linux as a building of rooms (folders). You're a person walking around: <code>pwd</code> = 'where am I?', <code>ls</code> = 'what's in this room?', <code>cd</code> = 'walk into a room', <code>mkdir</code> = 'build a room'.",
   steps:[
    {say:"Ask where you are. Every terminal starts in your <b>home</b>.",cmd:"pwd",out:"→ /home/ivan"},
    {say:"Look around. Add <code>-la</code> to see everything, including hidden files and details.",cmd:"ls -la",out:"Shows files plus <code>.</code> (this room) and <code>..</code> (the room above)."},
    {say:"Build a room and check it appeared.",cmd:"mkdir practice\nls",out:"→ practice"},
    {say:"Walk into it and confirm you moved.",cmd:"cd practice\npwd",out:"→ /home/ivan/practice"},
    {say:"Go back up one level. <code>..</code> means 'the room above me'.",cmd:"cd ..\npwd",out:"→ /home/ivan"}
   ],
   trip:"Going <i>back</i> is where beginners freeze. Memorize three escapes: <code>cd ..</code> goes up one level, <code>cd</code> (alone) jumps home instantly, <code>cd -</code> returns to the last folder you were in. Lost? Type <code>cd</code> and you're home.",
   ref:[["pwd","Where am I?"],["ls -la","List all, with details"],["cd folder","Go in"],["cd ..","Go up one"],["cd","Jump home"],["cd -","Back to previous folder"],["mkdir name","Make a folder"],["Tab","Autocomplete a name"]],
   mastery:"From memory: go home, make <code>mission</code>, enter it, make <code>data</code> and <code>logs</code> inside, enter <code>data</code> and run <code>pwd</code>, then jump straight home.",
   sol:`<pre><code>cd
mkdir mission
cd mission
mkdir data logs
cd data
pwd            <span class="out"># /home/ivan/mission/data</span>
cd             <span class="out"># straight home</span></code></pre><p>Tip: press <code>Tab</code> after typing a few letters of a folder name to autocomplete and avoid typos.</p>`,
   link:{label:"Ubuntu command line tutorial",url:"https://ubuntu.com/tutorials/command-line-for-beginners"}},

  {t:"Manage files: cp, mv, rm, cat",
   model:"Same building, but now you handle the objects inside the rooms: create, read, copy, rename, throw away. One warning up front: Linux has <b>no Recycle Bin</b> — <code>rm</code> is permanent.",
   steps:[
    {say:"Create a file by writing text into it. <code>></code> means 'send this into a file'.",cmd:'echo "hello" > note.txt',out:"Creates note.txt containing 'hello'."},
    {say:"Read it back.",cmd:"cat note.txt",out:"→ hello"},
    {say:"Copy it, then rename the copy. <code>cp</code> = copy, <code>mv</code> = move/rename.",cmd:"cp note.txt backup.txt\nmv backup.txt old.txt",out:"Now you have note.txt and old.txt."},
    {say:"Delete a file.",cmd:"rm old.txt",out:"Gone — permanently."}
   ],
   trip:"<code>rm -r folder/</code> deletes a folder <i>and everything inside it</i> with no confirmation and no undo. Before running any <code>rm</code>, glance at <code>ls</code> first to be sure you're deleting what you think you are.",
   ref:[["echo x > f","Write x into file f"],["cat f","Print a file"],["cp a b","Copy a to b"],["mv a b","Rename/move a to b"],["rm f","Delete a file"],["rm -r d","Delete a folder + contents"]],
   mastery:"Make a file with your name in it using <code>echo</code>, print it with <code>cat</code>, copy it, then delete the copy.",
   sol:`<pre><code>echo "Ivan How" &gt; name.txt
cat name.txt          <span class="out"># Ivan How</span>
cp name.txt copy.txt
rm copy.txt
ls                    <span class="out"># only name.txt remains</span></code></pre>`,
   link:{label:"File commands",url:"https://ubuntu.com/tutorials/command-line-for-beginners"}},

  {t:"Move files between Windows and Linux",
   model:"You have two filing cabinets side by side. Windows files appear inside Linux at <code>/mnt/c/</code>. Linux files appear inside Windows Explorer at <code>\\\\wsl$\\Ubuntu\\home\\you</code>. Same drive, two doors.",
   steps:[
    {say:"Peek at your Windows Desktop from inside Linux.",cmd:"ls /mnt/c/Users/YourName/Desktop",out:"Lists your real Windows desktop files."},
    {say:"Copy a Linux file onto your Windows Desktop.",cmd:"cp ~/name.txt /mnt/c/Users/YourName/Desktop/",out:"It now appears on your Windows desktop."},
    {say:"Open the current Linux folder in Windows Explorer.",cmd:"explorer.exe .",out:"A normal Explorer window opens, drag-and-drop works."}
   ],
   trip:"Performance trap: running coding tools (npm, git, build) on files under <code>/mnt/c/</code> is much <b>slower</b>. Golden rule — keep your projects in the Linux side (<code>~/</code>), and only reach into <code>/mnt/c/</code> when you specifically need a Windows file.",
   ref:[["/mnt/c/...","Your Windows C: drive, from Linux"],["explorer.exe .","Open this folder in Windows Explorer"],["ls /mnt/c/Users","Find your Windows username"]],
   mastery:"Copy a file from your Linux home to your Windows Desktop, then open it in Explorer with <code>explorer.exe .</code>",
   sol:`<pre><code>cp ~/name.txt /mnt/c/Users/YourName/Desktop/
cd /mnt/c/Users/YourName/Desktop
explorer.exe .</code></pre><p>Replace <code>YourName</code> with your Windows username — run <code>ls /mnt/c/Users</code> if unsure.</p>`,
   link:{label:"WSL file systems",url:"https://learn.microsoft.com/en-us/windows/wsl/filesystems"}},

  {t:"Update packages: sudo apt update & upgrade",
   model:"Ubuntu installs software from an app-store-like system called <code>apt</code>. <code>sudo</code> is 'do this as admin'. Keeping packages fresh is the first thing to do on a new system.",
   steps:[
    {say:"Refresh the catalogue of available software.",cmd:"sudo apt update",out:"Downloads the latest package list (asks your password)."},
    {say:"Install everything that has updates. <code>-y</code> auto-answers 'yes'.",cmd:"sudo apt upgrade -y",out:"Upgrades installed packages."},
    {say:"Install a new tool to prove it works.",cmd:"sudo apt install tree -y\ntree",out:"<code>tree</code> draws your folders as a branching diagram."}
   ],
   trip:"<code>update</code> and <code>upgrade</code> are <b>different</b>: <code>update</code> refreshes the <i>list</i> of what's available, <code>upgrade</code> actually <i>installs</i> the newer versions. You almost always run them together: <code>sudo apt update && sudo apt upgrade -y</code>.",
   ref:[["sudo apt update","Refresh package list"],["sudo apt upgrade -y","Install updates"],["sudo apt install x","Install package x"],["sudo apt remove x","Remove package x"]],
   mastery:"Run the update+upgrade combo, then install <code>tree</code> and run it inside any folder.",
   sol:`<pre><code>sudo apt update && sudo apt upgrade -y
sudo apt install tree -y
tree</code></pre>`,
   link:{label:"apt package basics",url:"https://ubuntu.com/server/docs/package-management"}},

  {t:"Install and configure git",
   model:"Git is a time machine for your code: it saves snapshots ('commits') you can return to, and pushes your work to GitHub. You'll use it for your own projects and to clone the Unitree SDK later.",
   steps:[
    {say:"Install git.",cmd:"sudo apt install git -y\ngit --version",out:"Prints a version like git 2.43.x."},
    {say:"Tell git who you are (it stamps every commit with this). Do this once.",cmd:'git config --global user.name "Ivan How"\ngit config --global user.email "ivanhowmk12@gmail.com"',out:"No output = success."},
    {say:"Make your first repository and first snapshot.",cmd:'mkdir ~/first-repo && cd ~/first-repo\ngit init\necho "# My project" > README.md\ngit add README.md\ngit commit -m "First commit"',out:"git records your first commit."}
   ],
   trip:"<code>git add</code> then <code>git commit</code> trips everyone at first. <code>add</code> = 'stage these changes' (put them on the tray); <code>commit</code> = 'save the tray as a snapshot'. A change isn't saved until you've done both.",
   ref:[["git init","Start tracking a folder"],["git add f","Stage a change"],["git commit -m \"...\"","Save a snapshot"],["git status","What's changed?"],["git log","See past commits"]],
   mastery:"Install git, set your name/email, then create a folder, <code>git init</code> it, and make your first commit.",
   sol:`<pre><code>sudo apt install git -y
git config --global user.name "Ivan How"
git config --global user.email "ivanhowmk12@gmail.com"
mkdir ~/first-repo && cd ~/first-repo
git init
echo "# My project" &gt; README.md
git add README.md
git commit -m "First commit"
git log   <span class="out"># shows your commit</span></code></pre>`,
   link:{label:"Git first-time setup",url:"https://git-scm.com/book/en/v2/Getting-Started-First-Time-Git-Setup"}},

  {t:"Comfortable opening a terminal without panic",
   model:"Fluency = these reflexes go automatic. This lesson is pure muscle memory: the shortcuts that make the terminal fast instead of scary.",
   steps:[
    {say:"Stop a command that's running or stuck.",cmd:"Ctrl + C",out:"Cancels the current command."},
    {say:"Clear a cluttered screen.",cmd:"Ctrl + L",out:"Fresh, empty terminal (your work is untouched)."},
    {say:"Reuse past commands instead of retyping.",cmd:"Up arrow   /   Ctrl + R",out:"Up = previous commands; Ctrl+R = search history."},
    {say:"If WSL itself acts stuck, reset it from PowerShell.",cmd:"wsl --shutdown",out:"Stops WSL cleanly; reopen the terminal for a fresh start."}
   ],
   trip:"People retype long commands by hand and make typos. Don't — press <b>Up arrow</b> to bring back the last command, and <b>Tab</b> to autocomplete file names. These two habits save you more time than anything else.",
   ref:[["Ctrl + C","Stop a command"],["Ctrl + L","Clear screen"],["Tab","Autocomplete"],["Up arrow","Previous command"],["Ctrl + R","Search history"],["man ls","Read a command's manual (q to quit)"]],
   mastery:"Without looking it up: go home, make a folder, enter it, create a file, list it, and delete it — all from memory.",
   sol:`<pre><code>cd
mkdir test
cd test
touch file.txt   <span class="out"># touch makes an empty file</span>
ls
rm file.txt</code></pre><p>If that flowed without thinking, you've got the terminal basics down.</p>`,
   link:{label:"WSL FAQ",url:"https://learn.microsoft.com/en-us/windows/wsl/faq"}}
 ]},

{id:"python",icon:"🐍",title:"Python",time:"2–4 weeks",why:"Most Unitree examples are Python first. Faster to prototype and test on the robot.",
 resource:{label:"Official Python tutorial",url:"https://docs.python.org/3/tutorial/"},
 tasks:[
  {t:"Variables and data types",
   model:"A variable is a labelled box that holds a value. You don't declare a type — Python looks at what you put in and figures it out.",
   steps:[
    {say:"Put a file together. Create <code>intro.py</code> with a text editor (<code>nano intro.py</code>) and add a few variables of different types.",cmd:'name = "Ivan"      # str  (text)\nage = 21           # int  (whole number)\nheight = 1.75      # float (decimal)\nis_student = True  # bool',out:""},
    {say:"Add a list (ordered collection) and a dict (key→value), then print things.",cmd:'scores = [90, 85, 88]\nrobot = {"name": "G1", "legs": 2}\nprint(name, age, robot["name"])',out:""},
    {say:"Run the file.",cmd:"python3 intro.py",out:"→ Ivan 21 G1"}
   ],
   trip:"Quotes matter. <code>age = 21</code> is a number you can do math on; <code>age = \"21\"</code> is text. Mixing them (<code>\"21\" + 1</code>) throws an error. Use numbers for math, strings for text.",
   ref:[["str","Text: \"hello\""],["int","Whole number: 21"],["float","Decimal: 1.75"],["bool","True / False"],["list","[1, 2, 3]"],["dict","{\"k\": v}"]],
   mastery:"Make variables for your name, age, and a list of 3 hobbies. Print them.",
   sol:`<pre><code>name = "Ivan"
age = 21
hobbies = ["chess", "coding", "robotics"]
print(name, age, hobbies)</code></pre>`,
   link:{label:"Python data types",url:"https://docs.python.org/3/tutorial/introduction.html"}},

  {t:"Conditionals: if / elif / else",
   model:"This is how a program makes decisions — the seed of every robot behaviour ('if too close, stop'). Indentation (4 spaces) defines which lines belong to which branch.",
   steps:[
    {say:"Write a decision based on a value.",cmd:'battery = 35\nif battery > 80:\n    print("Full power")\nelif battery > 20:\n    print("Okay, keep going")\nelse:\n    print("Return to charge!")',out:"→ Okay, keep going"},
    {say:"Change <code>battery</code> to 90, run again, and watch a different branch fire.",cmd:"python3 decide.py",out:"→ Full power"}
   ],
   trip:"Python is strict about <b>indentation</b>. Every line inside an <code>if</code> must be indented the same amount (4 spaces). Mixing tabs and spaces, or uneven indenting, throws <code>IndentationError</code>. Pick 4 spaces and stay consistent.",
   ref:[["==","equal"],["!=","not equal"],["> < >= <=","comparisons"],["and / or / not","combine conditions"]],
   mastery:"Write a program that reads a number and prints whether it's positive, negative, or zero.",
   sol:`<pre><code>num = float(input("Enter a number: "))
if num &gt; 0:
    print("positive")
elif num &lt; 0:
    print("negative")
else:
    print("zero")</code></pre><p><code>float()</code> turns the typed text into a number so you can compare it.</p>`,
   link:{label:"Control flow",url:"https://docs.python.org/3/tutorial/controlflow.html"}},

  {t:"Loops: for and while",
   model:"Loops repeat work. <code>for</code> walks over a collection (do this for each item); <code>while</code> repeats as long as a condition stays true. A robot's control loop is just a <code>while</code> that never ends.",
   steps:[
    {say:"A counting loop. <code>range(5)</code> gives 0,1,2,3,4.",cmd:'for i in range(5):\n    print("step", i)',out:"→ step 0 … step 4"},
    {say:"Walk over a list directly.",cmd:'for hobby in ["chess", "code"]:\n    print(hobby)',out:"→ chess / code"},
    {say:"A while loop that counts down.",cmd:"count = 3\nwhile count > 0:\n    print(count)\n    count = count - 1",out:"→ 3 / 2 / 1"}
   ],
   trip:"The classic <b>infinite loop</b>: in a <code>while</code>, if you forget to change the condition variable (the <code>count = count - 1</code> line), it runs forever. Press <code>Ctrl + C</code> to escape, then add the line that moves it toward the exit.",
   ref:[["for x in seq:","Loop each item"],["range(n)","0 … n-1"],["range(a,b)","a … b-1"],["while cond:","Repeat while true"],["break","Exit the loop now"]],
   mastery:"Use a <code>for</code> loop to print the squares of numbers 1 through 10.",
   sol:`<pre><code>for n in range(1, 11):   <span class="out"># 1..10 (11 excluded)</span>
    print(n, "squared is", n * n)</code></pre>`,
   link:{label:"Loops & range",url:"https://docs.python.org/3/tutorial/controlflow.html#for-statements"}},

  {t:"Functions: define, arguments, return",
   model:"A function is a named, reusable block of code. You feed it inputs (arguments) and it can hand back a result (<code>return</code>). Write the logic once, call it everywhere.",
   steps:[
    {say:"Define a function that returns a value.",cmd:'def add(a, b):\n    return a + b',out:"Defines it — nothing runs yet."},
    {say:"Call it and use the result.",cmd:'total = add(3, 4)\nprint(total)',out:"→ 7"},
    {say:"Another, with text.",cmd:'def greet(name):\n    return "Hello, " + name\nprint(greet("Ivan"))',out:"→ Hello, Ivan"}
   ],
   trip:"<code>return</code> vs <code>print</code> confuses beginners. <code>print</code> just shows text on screen; <code>return</code> hands a value <i>back to your code</i> so you can store and reuse it. A function without <code>return</code> gives back <code>None</code>.",
   ref:[["def f(x):","Define function f"],["return v","Send v back to caller"],["f(3)","Call f with argument 3"]],
   mastery:"Write a function <code>area(width, height)</code> that returns width × height, and call it with a few values.",
   sol:`<pre><code>def area(width, height):
    return width * height

print(area(3, 4))   <span class="out"># 12</span>
print(area(5, 2))   <span class="out"># 10</span></code></pre>`,
   link:{label:"Defining functions",url:"https://docs.python.org/3/tutorial/controlflow.html#defining-functions"}},

  {t:"Classes and objects (OOP basics)",
   model:"A class is a blueprint; an object is one thing built from it. This is the big one: a ROS2 node is a class, and a robot in the SDK is an object. Nail this and the next chapters feel familiar.",
   steps:[
    {say:"Define a blueprint with a constructor (<code>__init__</code>) and a method.",cmd:'class Robot:\n    def __init__(self, name, legs):\n        self.name = name\n        self.legs = legs\n    def walk(self):\n        print(self.name, "walks on", self.legs, "legs")',out:""},
    {say:"Build an object from the blueprint and use it.",cmd:'g1 = Robot("G1", 2)\ng1.walk()',out:"→ G1 walks on 2 legs"}
   ],
   trip:"<code>self</code> baffles everyone at first. It just means 'this particular object'. Every method's first parameter is <code>self</code>, and you use <code>self.name</code> to reach that object's own data. You never pass <code>self</code> yourself — Python fills it in.",
   ref:[["class Name:","Define a blueprint"],["__init__","Runs when you create an object"],["self.x","This object's attribute x"],["obj.method()","Call a method on an object"]],
   mastery:"Make a <code>Dog</code> class with a name and a <code>bark()</code> method. Create two dogs and make them bark.",
   sol:`<pre><code>class Dog:
    def __init__(self, name):
        self.name = name
    def bark(self):
        print(self.name + " says woof!")

d1 = Dog("Rex")
d2 = Dog("Bella")
d1.bark()   <span class="out"># Rex says woof!</span>
d2.bark()   <span class="out"># Bella says woof!</span></code></pre>`,
   link:{label:"Classes",url:"https://docs.python.org/3/tutorial/classes.html"}},

  {t:"Imports, modules, and pip",
   model:"You don't write everything yourself. <code>import</code> pulls in code that ships with Python; <code>pip</code> installs new packages from the internet (this is how you'll later install robotics libraries).",
   steps:[
    {say:"Use a built-in module.",cmd:"import math\nprint(math.sqrt(16))",out:"→ 4.0"},
    {say:"Import just one thing from a module.",cmd:"from random import randint\nprint(randint(1, 6))",out:"→ a random number 1–6"},
    {say:"Install an external package (in the terminal, not Python).",cmd:"pip3 install numpy",out:"Downloads and installs numpy."}
   ],
   trip:"Best practice: make a <b>virtual environment</b> per project so packages don't collide: <code>python3 -m venv .venv && source .venv/bin/activate</code>. Your prompt shows <code>(.venv)</code> when it's active. ROS2 later has its own rules here, but for plain Python this keeps things clean.",
   ref:[["import m","Bring in module m"],["from m import x","Bring in just x"],["import m as n","Rename on import"],["pip3 install p","Install a package"]],
   mastery:"Install <code>numpy</code> with pip, then use it to create an array and print its sum.",
   sol:`<p>Terminal:</p><pre><code>pip3 install numpy</code></pre><p>Python:</p><pre><code>import numpy as np
arr = np.array([10, 20, 30, 40])
print(arr.sum())   <span class="out"># 100</span></code></pre>`,
   link:{label:"Modules",url:"https://docs.python.org/3/tutorial/modules.html"}},

  {t:"Files and error handling",
   model:"Programs read and write files, and things go wrong (missing file, bad input). <code>with open(...)</code> handles files safely; <code>try/except</code> catches errors so your program bends instead of crashing.",
   steps:[
    {say:"Write to a file. <code>\"w\"</code> = write mode; <code>with</code> auto-closes it.",cmd:'with open("log.txt", "w") as f:\n    f.write("session 1\\n")',out:"Creates log.txt with one line."},
    {say:"Read it back.",cmd:'with open("log.txt") as f:\n    print(f.read())',out:"→ session 1"},
    {say:"Catch an error instead of crashing.",cmd:'try:\n    value = int("not a number")\nexcept ValueError:\n    print("That was not a number!")',out:"→ That was not a number!"}
   ],
   trip:"Forgetting to close files causes subtle bugs. Always use <code>with open(...) as f:</code> — it closes the file for you automatically, even if an error happens mid-way. Avoid the bare <code>f = open(...)</code> style.",
   ref:[["open(f,\"w\")","Write (overwrites)"],["open(f,\"a\")","Append"],["open(f)","Read"],["try / except","Catch an error"],[".read() / .write()","Read or write text"]],
   mastery:"Write 3 lines to a file, read them back, then wrap a risky <code>int()</code> call in try/except.",
   sol:`<pre><code>with open("notes.txt", "w") as f:
    f.write("line 1\\n")
    f.write("line 2\\n")
    f.write("line 3\\n")

with open("notes.txt") as f:
    print(f.read())

try:
    n = int("oops")
except ValueError:
    print("Not a number — handled safely")</code></pre>`,
   link:{label:"Files & errors",url:"https://docs.python.org/3/tutorial/inputoutput.html"}},

  {t:"Capstone: a script that runs end-to-end",
   model:"Tie it together: variables + a class + a loop + file I/O in one program. Build a 'robot battery tracker' that drains a battery over several steps and logs each one.",
   steps:[
    {say:"Define a Battery class with a method that drains it (never below 0).",cmd:"class Battery:\n    def __init__(self, level):\n        self.level = level\n    def drain(self, amount):\n        self.level = max(0, self.level - amount)",out:""},
    {say:"Loop 5 steps, draining each time, and write every step to a file.",cmd:'bat = Battery(100)\nwith open("battery_log.txt", "w") as f:\n    for step in range(5):\n        bat.drain(15)\n        line = f"step {step}: {bat.level}%"\n        print(line)\n        f.write(line + "\\n")',out:"→ 85%, 70%, 55%, 40%, 25%"},
    {say:"Confirm the file was written.",cmd:"cat battery_log.txt",out:"Same 5 lines saved to disk."}
   ],
   trip:"This combines everything — if it errors, read the message bottom-up: it names the <i>line number</i> and the <i>type</i> of error. Most beginner bugs here are indentation or a typo'd variable name. Fix one, re-run, repeat.",
   mastery:"Build the battery tracker (or your own idea) end-to-end. Confirm the log file is written correctly.",
   sol:`<pre><code>class Battery:
    def __init__(self, level):
        self.level = level
    def drain(self, amount):
        self.level = max(0, self.level - amount)

bat = Battery(100)
with open("battery_log.txt", "w") as f:
    for step in range(5):
        bat.drain(15)
        line = f"step {step}: {bat.level}%"
        print(line)
        f.write(line + "\\n")</code></pre><p>Output: 85, 70, 55, 40, 25. Confirm with <code>cat battery_log.txt</code>.</p>`,
   link:{label:"Python tutorial index",url:"https://docs.python.org/3/tutorial/"}}
 ]},

{id:"ros2",icon:"🔗",title:"ROS2",time:"3–5 weeks (alongside Python)",why:"Start after basic Python — the tutorials use Python heavily. This is how robot software talks to itself.",
 resource:{label:"ROS2 official tutorials",url:"https://docs.ros.org/en/jazzy/Tutorials.html"},
 tasks:[
  {t:"Concepts: nodes and the graph",
   model:"A robot's software is a team of small programs called <b>nodes</b>, each with one job (read camera, balance, drive a motor). Together they form the <b>graph</b>. They cooperate without knowing each other directly.",
   steps:[
    {say:"Load ROS2 into your terminal. You do this in EVERY new terminal.",cmd:"source /opt/ros/jazzy/setup.bash",out:"No output = loaded."},
    {say:"Run a demo node that publishes messages.",cmd:"ros2 run demo_nodes_cpp talker",out:"→ Publishing: 'Hello World: 1' …"},
    {say:"In a SECOND terminal (source again), run a node that receives them.",cmd:"ros2 run demo_nodes_py listener",out:"→ I heard: 'Hello World: 1' …"},
    {say:"In a third terminal, list what's running.",cmd:"ros2 node list",out:"→ /talker  /listener"}
   ],
   trip:"The #1 ROS2 beginner mistake: forgetting to <code>source /opt/ros/jazzy/setup.bash</code> in each new terminal. If <code>ros2: command not found</code> appears, that's it — source it and try again. (Tip: add that line to your <code>~/.bashrc</code> so it runs automatically.)",
   ref:[["source .../setup.bash","Load ROS2 (every terminal)"],["ros2 run pkg node","Run a node"],["ros2 node list","List running nodes"]],
   mastery:"Run the talker and listener demo in two terminals and watch them communicate. Then run <code>ros2 node list</code>.",
   sol:`<pre><code><span class="out"># terminal 1</span>
source /opt/ros/jazzy/setup.bash
ros2 run demo_nodes_cpp talker
<span class="out"># terminal 2</span>
source /opt/ros/jazzy/setup.bash
ros2 run demo_nodes_py listener
<span class="out"># terminal 3</span>
ros2 node list   <span class="out"># /talker  /listener</span></code></pre>`,
   link:{label:"Nodes tutorial",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Nodes/Understanding-ROS2-Nodes.html"}},

  {t:"Topics: how data flows",
   model:"Nodes share data over named channels called <b>topics</b>. One node publishes; others subscribe. Like a radio station — broadcast on a frequency, anyone tuned in hears it. No direct connection needed.",
   steps:[
    {say:"With the talker running, list active topics.",cmd:"ros2 topic list",out:"→ /chatter  (among others)"},
    {say:"Watch the actual messages stream by.",cmd:"ros2 topic echo /chatter",out:"→ data: 'Hello World: 1' (then 2, 3…)"},
    {say:"Inspect a topic's type and how fast it's publishing.",cmd:"ros2 topic info /chatter\nros2 topic hz /chatter",out:"Shows message type + publish rate."}
   ],
   trip:"A publisher and subscriber only connect if they use the <b>same topic name AND the same message type</b>. If echo shows nothing, check the names match exactly (it's case-sensitive) — a typo'd topic name silently fails to connect.",
   ref:[["ros2 topic list","All topics"],["ros2 topic echo /t","Print messages"],["ros2 topic info /t","Type + counts"],["ros2 topic hz /t","Publish rate"]],
   mastery:"With the talker running, list topics, then <code>echo</code> the chatter topic to watch messages stream by.",
   sol:`<pre><code>ros2 topic list           <span class="out"># /chatter appears</span>
ros2 topic echo /chatter
<span class="out"># → data: 'Hello World: 1'  (then 2, 3, ...)</span></code></pre>`,
   link:{label:"Topics tutorial",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Topics/Understanding-ROS2-Topics.html"}},

  {t:"Write a Publisher node (Python)",
   model:"Now you write a node. It's a Python class that inherits from <code>Node</code> (remember classes?) and publishes a message on a timer. This is your first piece of real robot software.",
   steps:[
    {say:"Create <code>talker.py</code>. Set up the node, a publisher, and a 1-second timer.",cmd:'import rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import String\n\nclass Talker(Node):\n    def __init__(self):\n        super().__init__("talker")\n        self.pub = self.create_publisher(String, "chatter", 10)\n        self.create_timer(1.0, self.tick)',out:""},
    {say:"Add the timer callback that builds and publishes a message, plus the main entry point.",cmd:'    def tick(self):\n        msg = String()\n        msg.data = "hello from Ivan"\n        self.pub.publish(msg)\n\ndef main():\n    rclpy.init()\n    rclpy.spin(Talker())\n\nif __name__ == "__main__":\n    main()',out:""},
    {say:"Run it, and confirm from another terminal.",cmd:"python3 talker.py\n# other terminal:\nros2 topic echo /chatter",out:"→ data: 'hello from Ivan'"}
   ],
   trip:"<code>rclpy.spin()</code> keeps the node alive so the timer keeps firing — without it the program would set up and immediately exit. Recognise the shape: it's exactly the Python class + method pattern from the Python chapter.",
   ref:[["rclpy.init()","Start ROS2"],["create_publisher(T,name,q)","Make a publisher"],["create_timer(s, fn)","Call fn every s seconds"],["rclpy.spin(node)","Keep node alive"]],
   mastery:"Type out this publisher, run it, and confirm with <code>ros2 topic echo /chatter</code> in another terminal.",
   sol:`<pre><code>import rclpy
from rclpy.node import Node
from std_msgs.msg import String

class Talker(Node):
    def __init__(self):
        super().__init__("talker")
        self.pub = self.create_publisher(String, "chatter", 10)
        self.create_timer(1.0, self.tick)
    def tick(self):
        msg = String(); msg.data = "hello from Ivan"
        self.pub.publish(msg)

def main():
    rclpy.init(); rclpy.spin(Talker())
if __name__ == "__main__":
    main()</code></pre>`,
   link:{label:"Writing a publisher",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Writing-A-Simple-Py-Publisher-And-Subscriber.html"}},

  {t:"Write a Subscriber node (Python)",
   model:"The mirror image of a publisher: subscribe to a topic and run a callback every time a message arrives. Publisher + subscriber together = a complete conversation.",
   steps:[
    {say:"Create <code>listener.py</code>. Subscribe to the same topic and register a callback.",cmd:'import rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import String\n\nclass Listener(Node):\n    def __init__(self):\n        super().__init__("listener")\n        self.create_subscription(String, "chatter", self.on_msg, 10)\n    def on_msg(self, msg):\n        self.get_logger().info("Got: " + msg.data)',out:""},
    {say:"Add the main entry point, then run talker and listener together.",cmd:"def main():\n    rclpy.init(); rclpy.spin(Listener())\n\n# run both:\npython3 talker.py    # terminal 1\npython3 listener.py  # terminal 2",out:"→ [INFO] Got: hello from Ivan"}
   ],
   trip:"The subscriber must use the <b>same topic name and message type</b> as the publisher (<code>String</code>, <code>\"chatter\"</code>). Mismatch = silence, no error. When 'nothing happens', that's the first thing to check.",
   ref:[["create_subscription(T,name,cb,q)","Subscribe + set callback"],["callback(self,msg)","Runs per message"],["get_logger().info()","Print a log line"]],
   mastery:"Run your publisher and this subscriber together. Confirm the listener logs each message.",
   sol:`<pre><code>python3 talker.py      <span class="out"># terminal 1</span>
python3 listener.py    <span class="out"># terminal 2 → Got: hello from Ivan</span></code></pre><p>The callback fires once per message the talker publishes.</p>`,
   link:{label:"Writing a subscriber",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Writing-A-Simple-Py-Publisher-And-Subscriber.html"}},

  {t:"Services and parameters",
   model:"Topics stream continuously. <b>Services</b> are request→response (ask once, get one answer — like a function call across nodes). <b>Parameters</b> are tunable settings on a node (e.g. a max speed you can change while it runs).",
   steps:[
    {say:"Start a node that offers a service.",cmd:"ros2 run demo_nodes_cpp add_two_ints_server",out:"Provides the /add_two_ints service."},
    {say:"Call the service from the command line.",cmd:'ros2 service call /add_two_ints example_interfaces/srv/AddTwoInts "{a: 2, b: 3}"',out:"→ response: sum=5"},
    {say:"List and read parameters on a node.",cmd:"ros2 param list\nros2 param get /some_node max_speed",out:"Shows tunable settings + values."}
   ],
   trip:"Don't reach for a service when you need a stream (or vice versa). Rule of thumb: continuous data (sensor readings, commands) = <b>topic</b>; one-off request that needs an answer (e.g. 'compute this') = <b>service</b>.",
   ref:[["ros2 service list","List services"],["ros2 service call /s type \"{...}\"","Call a service"],["ros2 param list","List parameters"],["ros2 param set /n p v","Set a parameter"]],
   mastery:"List services and parameters in a running demo, and call one service from the command line.",
   sol:`<pre><code>ros2 run demo_nodes_cpp add_two_ints_server   <span class="out"># terminal 1</span>
ros2 service list
ros2 service call /add_two_ints example_interfaces/srv/AddTwoInts "{a: 2, b: 3}"
<span class="out"># → sum=5</span>
ros2 param list</code></pre>`,
   link:{label:"Services tutorial",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-CLI-Tools/Understanding-ROS2-Services/Understanding-ROS2-Services.html"}},

  {t:"Build a package with colcon",
   model:"Real ROS2 code lives in <b>packages</b> inside a <b>workspace</b>, compiled with <code>colcon</code>. This is the structure every robot project (including the SDK demos) uses.",
   steps:[
    {say:"Make a workspace and create a package inside its <code>src</code> folder.",cmd:"mkdir -p ~/ros2_ws/src && cd ~/ros2_ws/src\nros2 pkg create --build-type ament_python my_pkg",out:"Scaffolds a package named my_pkg."},
    {say:"Put your <code>talker.py</code> in <code>my_pkg/my_pkg/</code> and register it in <code>setup.py</code> under console_scripts.",cmd:"# in setup.py entry_points:\n'talker = my_pkg.talker:main',",out:""},
    {say:"Build, load, and run.",cmd:"cd ~/ros2_ws\ncolcon build\nsource install/setup.bash\nros2 run my_pkg talker",out:"Your node runs from the package."}
   ],
   trip:"After every <code>colcon build</code> you must <code>source install/setup.bash</code> again, or ROS2 won't see your new build. 'My changes aren't showing up' almost always = forgot to rebuild or re-source. Also: always run <code>colcon build</code> from the workspace root, not <code>src</code>.",
   ref:[["ros2 pkg create","Make a package"],["colcon build","Compile the workspace"],["source install/setup.bash","Load your packages"],["ros2 run pkg node","Run from package"]],
   mastery:"Create a workspace and package, move your publisher into it, build with colcon, and run it via <code>ros2 run</code>.",
   sol:`<pre><code>mkdir -p ~/ros2_ws/src && cd ~/ros2_ws/src
ros2 pkg create --build-type ament_python my_pkg
<span class="out"># put talker.py in my_pkg/my_pkg/, register in setup.py:</span>
<span class="out">#   'talker = my_pkg.talker:main',</span>
cd ~/ros2_ws
colcon build
source install/setup.bash
ros2 run my_pkg talker</code></pre>`,
   link:{label:"Creating a package",url:"https://docs.ros.org/en/jazzy/Tutorials/Beginner-Client-Libraries/Creating-Your-First-ROS2-Package.html"}},

  {t:"Visualize with rqt_graph and echo",
   model:"Seeing the graph makes everything click. <code>rqt_graph</code> draws every node and the topics connecting them — debugging becomes 'spot the missing arrow'.",
   steps:[
    {say:"Run your publisher and subscriber.",cmd:"python3 talker.py\npython3 listener.py",out:"Both running."},
    {say:"Open the visual graph.",cmd:"rqt_graph",out:"A window: /talker → /chatter → /listener."},
    {say:"Cross-check from the command line.",cmd:"ros2 node info /talker",out:"Lists what the node publishes/subscribes."}
   ],
