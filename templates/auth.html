<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceFilter — Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo" style="justify-content:center;margin-bottom:1.5rem">
        <span class="logo-icon">🔍</span>
        <span class="logo-text">FaceFilter</span>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Create Account</button>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="form-login" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="auth-error hidden" id="login-error"></div>
        <button type="submit" class="btn btn--primary btn--full">
          <span class="btn-label">Sign In</span>
          <span class="spinner hidden"></span>
        </button>
      </form>

      <!-- Register form -->
      <form class="auth-form hidden" id="form-register" novalidate>
        <div class="field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" autocomplete="username" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="reg-password">Password <span class="hint-inline">(min 6 chars)</span></label>
          <input id="reg-password" type="password" autocomplete="new-password" placeholder="••••••••" required />
        </div>
        <div class="auth-error hidden" id="reg-error"></div>
        <button type="submit" class="btn btn--primary btn--full">
          <span class="btn-label">Create Account</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </div>
    <p class="auth-footer">All photos are stored privately on your account.</p>
  </div>

  <script>
    const $ = sel => document.querySelector(sel);

    // Tab switching
    document.querySelectorAll(".auth-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const which = tab.dataset.tab;
        $("#form-login").classList.toggle("hidden", which !== "login");
        $("#form-register").classList.toggle("hidden", which !== "register");
      });
    });

    function setLoading(form, loading) {
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = loading;
      btn.querySelector(".btn-label").classList.toggle("hidden", loading);
      btn.querySelector(".spinner").classList.toggle("hidden", !loading);
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    $("#form-login").addEventListener("submit", async e => {
      e.preventDefault();
      const errEl = $("#login-error");
      errEl.classList.add("hidden");
      setLoading(e.target, true);
      try {
        const res  = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email:    $("#login-email").value,
            password: $("#login-password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = "/";
      } catch (err) {
        showError(errEl, err.message || "Login failed");
        setLoading(e.target, false);
      }
    });

    $("#form-register").addEventListener("submit", async e => {
      e.preventDefault();
      const errEl = $("#reg-error");
      errEl.classList.add("hidden");
      setLoading(e.target, true);
      try {
        const res  = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: $("#reg-username").value,
            email:    $("#reg-email").value,
            password: $("#reg-password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = "/";
      } catch (err) {
        showError(errEl, err.message || "Registration failed");
        setLoading(e.target, false);
      }
    });
  </script>
</body>
</html>
